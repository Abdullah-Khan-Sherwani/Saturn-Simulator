<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saturn &amp; Enceladus — WebGL 2.0</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    canvas:active { cursor: grabbing; }

    #loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: #000; z-index: 10; color: #9cf;
      font-family: 'Courier New', monospace; font-size: 1rem;
    }
    #loading-inner { display: grid; place-items: center; gap: .75rem; }
    .ring {
      width: 44px; height: 44px; border-radius: 50%;
      border: 3px solid #1a2a4a; border-top-color: #9cf;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #hud {
      position: fixed; bottom: 1rem; right: 1rem; z-index: 20;
      color: rgba(100, 150, 220, .45); font-family: 'Courier New', monospace;
      font-size: .7rem; line-height: 1.7; text-align: right;
      pointer-events: none; letter-spacing: .04em;
    }
  </style>
</head>
<body>

  <div id="loading">
    <div id="loading-inner">
      <div class="ring"></div>
      <span id="msg">Initialising…</span>
    </div>
  </div>

  <canvas id="c"></canvas>

  <div id="hud">
    SATURN &amp; ENCELADUS<br>
    GPU Ray Tracer · Phong Shading<br>
    Ray-traced shadows · Semi-transparent rings<br>
    <span style="opacity:.6">drag to orbit · scroll to zoom</span><br>
    <span id="view-mode" style="color:#9cf">press E — switch view</span>
  </div>

  <script type="module" src="/src/saturn.js"></script>
</body>
</html>
